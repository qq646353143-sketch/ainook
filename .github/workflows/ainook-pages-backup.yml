name: AINOOK news backup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/latest.json'
      - '.github/workflows/ainook-pages-backup.yml'
      - 'AINOOK-Review/cloud/build_pages.py'
      - 'AINOOK-Review/cloud/pages_search.js'
      - 'AINOOK-Review/cloud/sync_edition.py'
      - 'AINOOK-Review/ainook/news_edition.py'
      - 'AINOOK-Review/ainook/news_views.py'
      - 'AINOOK-Review/ainook/static/**'
      - 'AINOOK-Review/ainook/views.py'
      - 'AINOOK-Review/presentation/ainook-news-editorial/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ainook-pages-backup
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/configure-pages@v5
      - name: Build and verify the daily edition
        run: python3 -B AINOOK-Review/cloud/build_pages.py --wait-for-release --output _news_backup
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _news_backup
      - uses: actions/deploy-pages@v4
        id: deployment

name: AINOOK daily cloud edition

on:
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ainook-cloud-edition.yml'

permissions:
  contents: write

concurrency:
  group: ainook-daily-cloud-edition
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Validate and publish the latest issue
        run: |
          python3 AINOOK-Review/cloud/sync_edition.py
          git add -- AINOOK-Review/published/reader-cloud.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m '本次改动：同步网站每日资讯'
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }

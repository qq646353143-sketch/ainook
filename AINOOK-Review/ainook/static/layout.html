<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e2eaf4">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  {{canonical}}
  <link rel="icon" href="data:,">
  {{head}}
</head>
<body>
  <div class="ice-scene" aria-hidden="true"><span class="night-sky"></span><span class="scene-grid"></span><span class="scene-orbit"></span><span class="scene-orbit scene-orbit-far"></span><span class="scene-axis"></span></div>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-block">
        <a class="brand" href="/" aria-label="ainook. 首页">ainook.</a>
        <div class="brand-copy">
          <p class="brand-tagline" lang="en">Stay curious. Stay ahead.</p>
          <p class="brand-credit">一个由「爱学习」打造的 AI 探索空间</p>
        </div>
      </div>
      <nav class="site-nav" aria-label="主要导航">
        <a href="/"{{home_current}}>首页</a>
        <a href="/author"{{author_current}}>作者小屋</a>
        <button class="theme-switch" id="theme-switch" type="button" disabled aria-label="切换日夜主题">自动</button>
      </nav>
    </div>
  </header>
  {{main}}
</body>
</html>

<main class="tram" id="main">
  <div class="tram-layout">
    <header class="tram-intro">
      <h1>作者小屋</h1>
      <section aria-labelledby="author-name">
        <h2 id="author-name">爱学习x</h2>
        <p>进来坐会儿。</p>
      </section>
    </header>

    <figure class="tram-scene" aria-label="停在山坡上的观景电车">
      <div class="tram-art">
        <img class="tram-illustration" src="__TRAM_IMAGE__" alt="一节改成书房的青绿色观景电车停在山坡上，窗外有高云和远山。" width="1024" height="1536" fetchpriority="high" draggable="false">
        <div class="tram-effects" aria-hidden="true">
          <div class="tram-strap"><i></i></div>
          <div class="tram-ticket" hidden><i></i></div>
          <div class="tram-window" hidden><i></i></div>
          <div class="tram-dial" hidden><i></i><i></i><i></i></div>
        </div>
        <div class="tram-controls" hidden>
          <button type="button" data-action="ticket" aria-pressed="false" aria-label="桌沿的车票"></button>
          <button type="button" data-action="strap" aria-label="挂在车顶的吊环"></button>
          <button type="button" data-action="window" aria-label="观景窗"></button>
          <button type="button" data-action="dial" aria-pressed="false" aria-label="车头的表盘"></button>
        </div>
      </div>
    </figure>

    <div class="tram-caption">
      <div class="tram-reaction" role="status" aria-live="polite" aria-atomic="true"><p></p></div>
      <a href="/">返回首页 <span aria-hidden="true">↗</span></a>
    </div>
  </div>

  <section class="tram-journal" aria-labelledby="tram-journal-title">
    <h2 id="tram-journal-title">作者手记</h2>
    <p>给日记、学习和创作记录留个位置。</p>
  </section>
</main>

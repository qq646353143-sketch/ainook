<main class="room-studies duo-room acan-original" id="main">
  <div class="room-studies-layout">
    <header class="room-studies-intro">
      <h1>__FRIEND_NAME__</h1>
      <p>__FRIEND_INTRO__</p>
    </header>

    <figure class="room-studies-scene duo-figure" aria-label="半高墙隔开的卧室和情侣电竞房">
      <div class="room-studies-art duo-art">
        <img class="room-studies-illustration duo-illustration" src="__FRIEND_IMAGE__" alt="半高墙左边是一张双人床，右边是并排的两台电脑。" width="1024" height="1536" fetchpriority="high" draggable="false">
        <div class="duo-effects" aria-hidden="true">
          <div class="duo-lamp" hidden></div>
          <div class="duo-monitor duo-monitor-left" hidden></div>
          <div class="duo-monitor duo-monitor-right" hidden></div>
          <div class="duo-tower duo-tower-left" hidden></div>
          <div class="duo-tower duo-tower-right" hidden></div>
          <div class="duo-team" hidden></div>
          <div class="duo-cups" hidden><i></i><i></i></div>
        </div>
        <div class="duo-controls" hidden>
          <button class="room-studies-object" type="button" data-piece="lamp" aria-pressed="false" aria-label="床头灯"></button>
          <button class="room-studies-object" type="button" data-piece="left" aria-pressed="false" aria-label="左边的电脑"></button>
          <button class="room-studies-object" type="button" data-piece="right" aria-pressed="false" aria-label="右边的电脑"></button>
          <button class="room-studies-object" type="button" data-piece="cups" aria-label="两只杯子"></button>
        </div>
      </div>
    </figure>

    <div class="room-studies-caption">
      <div class="room-studies-reaction" role="status" aria-atomic="true"><p></p></div>
    </div>
  </div>

</main>

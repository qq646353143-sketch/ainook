<main class="room-studies doudou-room" id="main">
  <div class="room-studies-layout">
    <header class="room-studies-intro">
      <h1>__FRIEND_NAME__</h1>
      <p>__FRIEND_INTRO__</p>
    </header>

    <figure class="room-studies-scene" aria-label="豆豆的绿植窗台">
      <div class="room-studies-art doudou-set">
        <picture class="doudou-artwork">
          <source media="(max-width: 600px)" srcset="__FRIEND_MOBILE_IMAGE__">
          <img class="room-studies-illustration" src="__FRIEND_IMAGE__" alt="靠墙的橄榄绿双人软沙发，旁边是带亚麻窗帘的窗户、书桌和软包椅。" width="1024" height="1536" fetchpriority="high" draggable="false">
        </picture>
        <div class="doudou-light" aria-hidden="true"></div>
        <div class="doudou-curtains" aria-hidden="true"><i></i><i></i></div>
        <div class="doudou-window-plant" aria-hidden="true"><img class="room-studies-illustration" alt="" draggable="false"></div>
        <canvas class="doudou-cushion" data-x="195" data-y="420" width="166" height="118" aria-hidden="true" hidden></canvas>
        <div class="doudou-bookmark" aria-hidden="true"></div>
        <div class="doudou-drops" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="doudou-controls" hidden>
          <button class="room-studies-object" type="button" data-object="plant" aria-label="给橡皮树浇水"></button>
          <button class="room-studies-object" type="button" data-object="cushion" aria-label="按一按米白靠垫"></button>
          <button class="room-studies-object" type="button" data-object="curtain" aria-label="拉窗帘" aria-pressed="false"></button>
          <button class="room-studies-object" type="button" data-object="book" aria-label="翻看书签" aria-pressed="false"></button>
          <button class="room-studies-object" type="button" data-object="lamp" aria-label="开关落地灯" aria-pressed="false"></button>
        </div>
      </div>
    </figure>

    <div class="room-studies-caption">
      <div class="room-studies-reaction" role="status" aria-atomic="true"><p></p></div>
    </div>
  </div>
</main>

<main class="room-studies duo-room acan-room" id="main">
  <div class="room-studies-layout">
    <header class="room-studies-intro">
      <h1>__FRIEND_NAME__</h1>
      <p>__FRIEND_INTRO__</p>
    </header>

    <figure class="room-studies-scene duo-figure" aria-label="阿灿的双人电竞房和写歌角落">
      <div class="room-studies-art duo-art">
        <img class="room-studies-illustration duo-illustration" src="__FRIEND_IMAGE__" alt="矮墙左边是一张双人床，右边是两套并排的电脑，桌上有麦克风和手记。" width="1024" height="1536" fetchpriority="high" draggable="false">
        <div class="duo-effects" aria-hidden="true">
          <div class="duo-lamp" hidden></div>
          <div class="duo-monitor duo-monitor-left" hidden></div>
          <div class="duo-monitor duo-monitor-right" hidden><span class="acan-invite">给你留了位置</span></div>
          <div class="duo-tower duo-tower-left" hidden></div>
          <div class="duo-tower duo-tower-right" hidden></div>
          <div class="duo-cups" hidden><i></i><i></i></div>
          <div class="acan-mic-glow" hidden></div>
          <div class="acan-note acan-note-frame" hidden></div>
          <div class="acan-note acan-note-song" hidden></div>
        </div>
        <div class="duo-controls" hidden>
          <button class="room-studies-object" type="button" data-piece="lamp" aria-pressed="false" aria-label="床头灯"></button>
          <button class="room-studies-object" type="button" data-piece="frame" aria-pressed="false" aria-label="相框后的小纸条"></button>
          <button class="room-studies-object" type="button" data-piece="mic" aria-pressed="false" aria-label="试听桌上的旋律"></button>
          <button class="room-studies-object" type="button" data-piece="left" aria-pressed="false" aria-label="写歌的电脑"></button>
          <button class="room-studies-object" type="button" data-piece="cups" aria-label="两只杯子"></button>
          <button class="room-studies-object" type="button" data-piece="right" aria-pressed="false" aria-label="留给朋友的电脑"></button>
          <button class="room-studies-object" type="button" data-piece="song" aria-pressed="false" aria-label="写歌的手记"></button>
        </div>
      </div>
    </figure>

    <div class="room-studies-caption">
      <div class="room-studies-reaction" role="status" aria-atomic="true"><p></p></div>
    </div>
  </div>
</main>

<main class="lakeside" id="main">
  <div class="lakeside-layout">
    <header class="lakeside-intro">
      <h1>作者小屋</h1>
      <section aria-labelledby="author-name">
        <h2 id="author-name">爱学习x</h2>
        <p>进来坐会儿。</p>
      </section>
    </header>

    <figure class="lakeside-scene" aria-label="湖边的小屋">
      <div class="lakeside-art">
        <img class="lakeside-illustration" src="__LAKESIDE_SCENE__" alt="一间住在湖边的小屋，木桌上放着纸笔，露台外是云、湖水和远山。" width="1024" height="1536" fetchpriority="high" draggable="false">
        <div class="lakeside-effects" aria-hidden="true">
          <div class="lakeside-shimmer"><i></i><i></i></div>
          <div class="lakeside-breeze" hidden><i></i><i></i><i></i><i></i></div>
          <div class="lakeside-letter" hidden><span>给路过的人</span><span>休息不该成为奢侈品。</span></div>
          <div class="lakeside-guest" hidden><img src="__LAKESIDE_GUEST__" alt="" draggable="false"></div>
          <div class="lakeside-water" hidden><i></i><i></i><i></i></div>
        </div>
        <div class="lakeside-objects" hidden>
          <button type="button" data-action="breeze" aria-label="窗边的布帘"></button>
          <button type="button" data-action="letter" aria-pressed="false" aria-label="桌上的信"></button>
          <button type="button" data-action="guest" aria-pressed="false" aria-label="角落里的动静"></button>
          <button type="button" data-action="water" aria-label="湖水"></button>
        </div>
      </div>
    </figure>

    <div class="lakeside-caption">
      <div class="lakeside-reaction" role="status" aria-live="polite" aria-atomic="true"><p></p></div>
      <a href="/">返回首页 <span aria-hidden="true">↗</span></a>
    </div>
  </div>

  <section class="lakeside-journal" aria-labelledby="lakeside-journal-title">
    <h2 id="lakeside-journal-title">作者手记</h2>
    <p>给日记、学习和创作记录留个位置。</p>
  </section>
</main>

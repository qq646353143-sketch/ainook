<main class="room-studies" id="main">
  <div class="room-studies-layout">
    <header class="room-studies-intro">
      <h1>作者小屋</h1>
      <section aria-labelledby="author-name">
        <h2 id="author-name">爱学习x</h2>
        <p>进来坐会儿。</p>
      </section>
      <nav class="room-studies-choices" aria-label="小屋预览方案" hidden></nav>
    </header>

    <figure class="room-studies-scene" aria-label="可探索的微缩小屋">
      <div class="room-studies-art">
        <img class="room-studies-illustration" alt="" draggable="false">
        <div class="room-studies-effects" aria-hidden="true"></div>
        <div class="room-studies-objects"></div>
      </div>
    </figure>

    <div class="room-studies-caption">
      <div class="room-studies-reaction" role="status" aria-atomic="true">
        <span></span>
        <p></p>
      </div>
      <a href="/">返回首页 <span aria-hidden="true">↗</span></a>
    </div>
  </div>

  <section class="room-studies-journal" aria-labelledby="room-studies-journal-title">
    <h2 id="room-studies-journal-title">作者手记</h2>
    <p>给日记、学习和创作记录留个位置。</p>
  </section>
</main>
<template id="room-studies-data">__ROOM_STUDIES__</template>
